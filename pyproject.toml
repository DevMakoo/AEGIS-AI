[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
dynamic = ["version"]
description = "AEGIS — assistente pessoal inteligente para Windows."
readme = "README.md"
requires-python = ">=3.12"
# Intervalos compatíveis; as versões exatas ficam em requirements.txt.
dependencies = ["python-dotenv>=1.0,<2"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: Portuguese (Brazilian)",
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*", "core*", "ai*", "voice*", "interface*", "automation*", "memory*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
